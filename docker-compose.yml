# 공통 정의 — api + ui 두 서비스. DB는 없다 (2주차보다 가볍다).
#   실행 모드: docker compose up --build
#   개발 모드: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    build: ./api
    container_name: meal-planner-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false # v0.1 목 API는 LLM 키 없이도 뜬다
    environment:
      # 프롬프트에 넣을 후보 상한. 9999로 올리면 검색이 사실상 꺼져
      # v1.5와 같은 동작이 된다 — 전후 비교를 코드 수정 없이 할 수 있다
      CANDIDATE_TOP_K: ${CANDIDATE_TOP_K:-40}
      TZ: Asia/Seoul
    volumes:
      # 데이터 스냅샷과 0단 예제는 레포 루트에 있고, 컨테이너에는 읽기 전용으로 들어간다
      - ./data:/app/data:ro
      - ./examples:/app/examples:ro

  # 데이터 전처리 일회성 도구 — up으로는 안 뜨고, 이름을 지목해 run으로만 돈다.
  #   docker compose run --rm prepare-data data/음식DB.xlsx
  # K-FIND 음식DB 엑셀을 data/에 내려받아 두면 volume으로 컨테이너에 보인다.
  prepare-data:
    profiles: ["tools"]
    build: ./api # api와 같은 uv 이미지 재사용 — pandas·openpyxl은 실행 시에만 얹는다
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data # 스냅샷(foods.json)을 다시 쓰는 유일한 자리라 여기만 rw
    entrypoint:
      ["uv", "run", "--with", "pandas", "--with", "openpyxl", "python", "scripts/prepare_data.py"]

  # v2.0이 더한 도구. foods.json의 500종에 위키백과 설명문을 붙인다.
  #   네트워크만 쓰고 LLM도 키도 필요 없다 — 그래서 제일 싼 단계다.
  #   docker compose run --rm enrich-foods
  enrich-foods:
    profiles: ["tools"]
    build: ./api
    env_file:
      - path: .env
        required: false # 위키백과 단계는 키 없이 돈다. --llm-fallback만 키가 필요하다
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
    entrypoint: ["uv", "run", "--no-sync", "python", "scripts/enrich_foods.py"]

  # v2.0이 더한 도구 둘째. 설명문 500건을 벡터로 만들어 파일 하나에 담는다.
  #   벡터 DB 서비스는 없다 — 500건은 그럴 규모가 아니다.
  #   docker compose run --rm embed-foods
  embed-foods:
    profiles: ["tools"]
    build: ./api
    env_file:
      - path: .env
        required: false
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
    entrypoint: ["uv", "run", "--no-sync", "python", "scripts/embed_foods.py"]

  ui:
    build: ./ui
    container_name: meal-planner-ui
    ports:
      - "8501:8501"
    environment:
      TZ: Asia/Seoul
      # compose 네트워크에서 서비스 이름(api)이 곧 호스트명이다 (2주차 app↔db와 같은 원리)
      API_BASE_URL: http://api:8000
    depends_on:
      - api
