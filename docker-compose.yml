# 공통 정의 — api + ui 두 서비스. DB는 없다 (2주차보다 가볍다).
#   실행 모드: docker compose up --build
#   개발 모드: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    build: ./api
    container_name: meal-planner-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false # v0.1 목 API는 LLM 키 없이도 뜬다
    environment:
      TZ: Asia/Seoul
    volumes:
      # 데이터 스냅샷과 0단 예제는 레포 루트에 있고, 컨테이너에는 읽기 전용으로 들어간다
      - ./data:/app/data:ro
      - ./examples:/app/examples:ro

  # 데이터 전처리 일회성 도구 — up으로는 안 뜨고, 이름을 지목해 run으로만 돈다.
  #   docker compose run --rm prepare-data data/음식DB.xlsx
  # K-FIND 음식DB 엑셀을 data/에 내려받아 두면 volume으로 컨테이너에 보인다.
  prepare-data:
    profiles: ["tools"]
    build: ./api # api와 같은 uv 이미지 재사용 — pandas·openpyxl은 실행 시에만 얹는다
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data # 스냅샷(foods.json)을 다시 쓰는 유일한 자리라 여기만 rw
    entrypoint:
      ["uv", "run", "--with", "pandas", "--with", "openpyxl", "python", "scripts/prepare_data.py"]

  ui:
    build: ./ui
    container_name: meal-planner-ui
    ports:
      - "8501:8501"
    environment:
      TZ: Asia/Seoul
      # compose 네트워크에서 서비스 이름(api)이 곧 호스트명이다 (2주차 app↔db와 같은 원리)
      API_BASE_URL: http://api:8000
    depends_on:
      - api
