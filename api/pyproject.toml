[project]
name = "week03-meal-planner-api"
version = "0.1.0"
description = "한 주 밥상 — 나트륨 예산 안에서 저녁 7끼를 짜는 식단 플래너 API (3주차 라이브 시연)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.60",
    "instructor>=1.7",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
